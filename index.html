<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA · Foundations Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            line-height: 1.6;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 1440px;
            width: 100%;
        }

        /* ========== HEADER ========== */
        .header {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-left h1 i {
            background: linear-gradient(145deg, #2563eb, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.7rem;
        }

        .header-left .subhead {
            font-size: 0.95rem;
            color: #475569;
            margin-top: 0.2rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .progress-badge {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2563eb;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* ========== LAYOUT ========== */
        .dashboard {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            background: white;
            border-radius: 1.5rem;
            padding: 1.25rem 0.85rem;
            box-shadow: 0 4px 20px -8px rgba(15, 23, 42, 0.1);
            border: 1px solid #e9edf2;
            position: sticky;
            top: 1.5rem;
        }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: #64748b;
            padding: 0 0.6rem 0.7rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .ds-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .ds-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: transparent;
            border: none;
            width: 100%;
            padding: 0.65rem 0.8rem;
            border-radius: 0.85rem;
            font-size: 0.88rem;
            font-weight: 500;
            color: #334155;
            transition: all 0.15s ease;
            cursor: pointer;
            text-align: left;
            font-family: 'Inter', sans-serif;
            border: 1px solid transparent;
            position: relative;
        }

        .ds-btn i {
            font-size: 1rem;
            width: 1.4rem;
            color: #64748b;
            transition: color 0.15s;
        }

        .ds-btn:hover {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .ds-btn.active {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
            font-weight: 600;
        }

        .ds-btn.active i {
            color: #2563eb;
        }

        .ds-btn.active::after {
            content: '';
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 18px;
            background: #2563eb;
            border-radius: 4px;
        }

        /* ========== MAIN CONTENT ========== */
        .main {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .concept-card {
            background: white;
            border-radius: 1.75rem;
            padding: 1.75rem;
            box-shadow: 0 4px 20px -8px rgba(15, 23, 42, 0.08);
            border: 1px solid #e9edf2;
            transition: all 0.2s;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .concept-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .concept-title i {
            color: #2563eb;
            font-size: 1.4rem;
        }

        .badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50px;
            padding: 0.25rem 0.85rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .concept-desc {
            font-size: 0.98rem;
            color: #1e293b;
            margin-bottom: 1.5rem;
            line-height: 1.7;
            background: #f8fafc;
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            border-left: 4px solid #3b82f6;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .concept-desc i {
            color: #3b82f6;
            font-size: 1.1rem;
            margin-top: 0.15rem;
            flex-shrink: 0;
        }

        /* ========== VISUALIZATION ========== */
        .canvas-wrapper {
            background: #f8fafc;
            border-radius: 1.25rem;
            padding: 1.25rem 1rem;
            border: 1px solid #e9edf2;
            margin-bottom: 1.25rem;
        }

        .canvas-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .canvas-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .canvas-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .canvas-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 160px;
            gap: 0.6rem;
            padding: 0.5rem;
            position: relative;
        }

        .block {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6;
            border-radius: 0.9rem;
            min-width: 72px;
            height: 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1e40af;
            box-shadow: 0 4px 0 #bfdbfe, 0 6px 12px -4px rgba(15, 23, 42, 0.12);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            padding: 0.2rem;
            position: relative;
            font-size: 1rem;
        }

        .block .index-label {
            font-size: 0.6rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 0.1rem;
        }

        .block.highlight {
            border-color: #f59e0b;
            background: #fffbeb;
            transform: scale(1.08);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 4px 0 #d97706;
        }

        .block.algo-highlight {
            border-color: #8b5cf6;
            background: #f5f3ff;
            transform: scale(1.08);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25), 0 4px 0 #7c3aed;
        }

        .node {
            display: flex;
            align-items: center;
            gap: 0.15rem;
        }

        .node-block {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6;
            border-radius: 0.9rem;
            min-width: 64px;
            height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1e40af;
            box-shadow: 0 4px 0 #bfdbfe, 0 6px 10px -4px rgba(15, 23, 42, 0.1);
            padding: 0.2rem;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .node-block.highlight {
            border-color: #f59e0b;
            background: #fffbeb;
            transform: scale(1.08);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 4px 0 #d97706;
        }

        .node-block.algo-highlight {
            border-color: #8b5cf6;
            background: #f5f3ff;
            transform: scale(1.08);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25), 0 4px 0 #7c3aed;
        }

        .node-arrow {
            font-size: 1.4rem;
            color: #94a3b8;
            font-weight: 300;
            margin: 0 -0.15rem;
        }

        .node-arrow.double {
            font-size: 1rem;
            color: #94a3b8;
            margin: 0 0.05rem;
        }

        .node-sub {
            font-size: 0.55rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 0.1rem;
        }

        .circular-badge {
            background: #eff6ff;
            border-radius: 40px;
            padding: 0.25rem 0.75rem;
            font-size: 0.65rem;
            font-weight: 700;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            margin-left: 0.4rem;
        }

        .vertical-stack {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: flex-start;
            gap: 0.35rem;
            min-height: 160px;
            padding: 0.5rem 1.5rem;
            border-left: 3px dashed #cbd5e1;
            border-right: 3px dashed #cbd5e1;
            margin: 0 auto;
            width: fit-content;
        }

        .stack-block {
            width: 100px;
            height: 48px;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1e40af;
            box-shadow: 0 3px 0 #bfdbfe;
            transition: all 0.25s;
            font-size: 0.95rem;
        }

        .stack-block.top-highlight {
            border-color: #f59e0b;
            background: #fffbeb;
            transform: translateX(5px);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 3px 0 #d97706;
        }

        .stack-block.algo-highlight {
            border-color: #8b5cf6;
            background: #f5f3ff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25), 0 3px 0 #7c3aed;
        }

        .queue-horizontal {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 1rem 0.5rem;
        }

        .queue-block {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6;
            border-radius: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1e40af;
            box-shadow: 0 4px 0 #bfdbfe;
            transition: all 0.25s;
            font-size: 0.95rem;
        }

        .queue-block.front-highlight {
            border-color: #f59e0b;
            background: #fffbeb;
            transform: translateY(-4px);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 4px 0 #d97706;
        }

        .queue-block.algo-highlight {
            border-color: #8b5cf6;
            background: #f5f3ff;
            transform: translateY(-4px);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25), 0 4px 0 #7c3aed;
        }

        /* ========== CONTROLS ========== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.25rem;
            align-items: center;
        }

        .btn {
            background: white;
            border: 1.5px solid #e2e8f0;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .btn i {
            font-size: 0.85rem;
        }

        .btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #0f172a;
        }

        .btn.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
            box-shadow: 0 4px 12px -4px rgba(37, 99, 235, 0.4);
        }

        .btn.primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* ========== COLLAPSIBLE SECTIONS ========== */
        .section {
            margin-top: 1.5rem;
            border-top: 1px solid #e9edf2;
            padding-top: 1.25rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 0.5rem 0;
            user-select: none;
            border-radius: 0.5rem;
            transition: background 0.15s;
        }

        .section-header:hover {
            background: #f8fafc;
        }

        .section-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-header h3 i {
            color: #2563eb;
            font-size: 0.95rem;
        }

        .section-toggle {
            color: #94a3b8;
            font-size: 0.85rem;
            transition: transform 0.2s;
        }

        .section-toggle.open {
            transform: rotate(180deg);
        }

        .section-body {
            padding: 0.75rem 0 0.25rem;
            display: none;
        }

        .section-body.open {
            display: block;
        }

        /* ========== INSIGHT GRID ========== */
        .insight-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        .insight-item {
            background: #f8fafc;
            padding: 0.85rem 1rem;
            border-radius: 1rem;
            border: 1px solid #e9edf2;
        }

        .insight-item .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .insight-item .label i {
            font-size: 0.7rem;
            color: #3b82f6;
        }

        .insight-item .value {
            font-size: 0.9rem;
            font-weight: 500;
            color: #0f172a;
            line-height: 1.5;
        }

        /* ========== NOTES ========== */
        .notes-content {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1.25rem;
            border: 1px solid #e9edf2;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #1e293b;
        }

        .notes-content h4 {
            font-size: 1rem;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .notes-content p {
            margin-bottom: 0.7rem;
        }

        .notes-content ul {
            margin: 0.4rem 0 0.8rem 1.25rem;
        }

        .notes-content li {
            margin-bottom: 0.4rem;
        }

        .notes-content li strong {
            color: #2563eb;
            font-weight: 600;
        }

        .notes-content code {
            background: #e2e8f0;
            padding: 0.1rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0f172a;
        }

        .note-highlight {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 0.7rem 1rem;
            border-radius: 0.6rem;
            margin: 0.8rem 0;
            font-size: 0.88rem;
        }

        .note-highlight strong {
            color: #d97706;
        }

        /* ========== MEMORY MAP SECTION ========== */
        .memory-map {
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #bae6fd;
            margin-top: 0.5rem;
        }

        .memory-map h4 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0369a1;
            margin-bottom: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .memory-map h4 i {
            font-size: 1rem;
        }

        .memory-map .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.85rem;
        }

        .memory-map .map-card {
            background: white;
            border-radius: 0.85rem;
            padding: 0.9rem 1rem;
            border: 1px solid #bae6fd;
            box-shadow: 0 2px 8px -4px rgba(3, 105, 161, 0.15);
        }

        .memory-map .map-card .map-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 700;
            color: #0369a1;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .memory-map .map-card .map-label i {
            font-size: 0.7rem;
        }

        .memory-map .map-card .map-value {
            font-size: 0.88rem;
            color: #0f172a;
            line-height: 1.6;
        }

        .memory-map .map-value code {
            background: #e0f2fe;
            padding: 0.1rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.82rem;
            font-weight: 600;
            color: #0369a1;
        }

        .memory-map .derivation-box {
            background: white;
            border-radius: 0.85rem;
            padding: 1rem 1.2rem;
            border: 1px solid #bae6fd;
            margin-top: 0.85rem;
        }

        .memory-map .derivation-box .step {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.7rem;
            align-items: flex-start;
        }

        .memory-map .derivation-box .step:last-child {
            margin-bottom: 0;
        }

        .memory-map .derivation-box .step-num {
            background: #0369a1;
            color: white;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        .memory-map .derivation-box .step-text {
            font-size: 0.88rem;
            color: #0f172a;
            line-height: 1.6;
        }

        .memory-map .derivation-box .step-text strong {
            color: #0369a1;
        }

        .memory-map .pattern-tag {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 50px;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 700;
            margin: 0.15rem;
        }

        /* ========== SCENARIOS ========== */
        .scenario-tabs {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .scenario-tab {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 2rem;
            padding: 0.45rem 1rem;
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .scenario-tab i {
            font-size: 0.75rem;
        }

        .scenario-tab:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .scenario-tab.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 4px 12px -4px rgba(37, 99, 235, 0.4);
        }

        .scenario-panel {
            background: #f8fafc;
            border-radius: 1.25rem;
            border: 1px solid #e9edf2;
            padding: 1.25rem;
        }

        .scenario-panel h4 {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .scenario-panel h4 i {
            color: #2563eb;
        }

        .problem-statement {
            background: #eff6ff;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border-left: 4px solid #3b82f6;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #1e293b;
        }

        .approach-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .approach-card {
            background: white;

            padding: 0.85rem 0.9rem;
            border: 1.5px solid #e9edf2;
            transition: all 0.15s;

            border-color: #bfdbfe;
            box-shadow: 0 4px 12px -6px rgba(37, 99, 235, 0.15);
        }

        .approach-card .approach-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .approach-card .approach-label.brute {
            color: #dc2626;
        }

        .approach-card .approach-label.better {
            color: #d97706;
        }

        .approach-card .approach-label.best {
            color: #16a34a;
        }

        .approach-card .approach-time {
            font-size: 0.72rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 0.5rem;
            padding: 0.2rem 0.5rem;
            background: #f8fafc;
            border-radius: 0.4rem;
            display: inline-block;
        }

        .pseudo-wrapper {
            position: relative;
            margin-top: 0.4rem;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #0f172a;
        }

        .pseudo-wrapper pre {
            background: transparent;
            color: #e2e8f0;
            padding: 0.75rem 0.85rem;
            font-size: 0.72rem;
            line-height: 1.6;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
            transition: none;
        }

        .pseudo-wrapper pre .keyword {
            color: #60a5fa;
        }

        .pseudo-wrapper pre .type {
            color: #fbbf24;
        }

        .pseudo-wrapper pre .comment {
            color: #64748b;
            font-style: italic;
        }

        .pseudo-line {
            display: block;
            padding: 0.1rem 0.4rem;
            border-radius: 0.3rem;
            transition: background 0.25s, color 0.25s, transform 0.15s;
            border-left: 3px solid transparent;
        }

        .pseudo-line.active {
            background: rgba(139, 92, 246, 0.2);
            border-left-color: #8b5cf6;
            color: #ffffff;
            font-weight: 500;
        }

        .pseudo-line.executed {
            background: rgba(16, 185, 129, 0.08);
            border-left-color: #10b981;
        }

        .pseudo-line .line-num {
            display: inline-block;
            width: 1.6rem;
            color: #64748b;
            font-size: 0.65rem;
            user-select: none;
            text-align: right;
            margin-right: 0.5rem;
            font-weight: 400;
        }

        .pseudo-line.active .line-num {
            color: #c4b5fd;
        }

        .anim-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }

        .anim-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2rem;
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-family: 'Inter', sans-serif;
        }

        .anim-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .anim-btn.play {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        .anim-btn.play:hover {
            background: #1d4ed8;
        }

        .anim-btn.stop {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }

        .anim-btn.stop:hover {
            background: #b91c1c;
        }

        .anim-btn i {
            font-size: 0.65rem;
        }

        .anim-status {
            font-size: 0.68rem;
            color: #94a3b8;
            margin-left: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .anim-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #64748b;
            display: inline-block;
        }

        .anim-status .dot.running {
            background: #8b5cf6;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 960px) {
            .approach-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 800px) {
            body { padding: 1rem; }
            .dashboard {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                display: flex;
                flex-wrap: wrap;
                align-items: center;

                padding: 0.85rem;

            }

                padding: 0 0 0.4rem;
                margin-bottom: 0;

            .ds-btn {

                font-size: 0.8rem;

            }
            .ds-btn.active::after {

            }
            .ds-btn i {

                width: 1rem;
            }

            }
            .concept-title { font-size: 1.3rem; }

        .dll-container, .circular-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.15rem;
        }

            // ============================================================

            // ============================================================
            // HIGHLIGHT PSEUDOCODE
            // ============================================================
            function highlightPseudocode(code, approachKey, scenarioIndex) {
                const lines = code.split('\n');
                const scenario = DS[currentDS].scenarios[scenarioIndex];
                const data = scenario[approachKey];
                const pseudoLines = data.lines || lines;

                let html = '';
                for (let i = 0; i < pseudoLines.length; i++) {
                    let line = pseudoLines[i]
                        .replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/(\/\/.*)/g, '<span class="comment">$1</span>')
                        .replace(/\b(INT|FLOAT|BOOLEAN|CHAR|VOID|STRING|LIST|MAP|SET|QUEUE|STACK|NODE|TREENODE|LISTNODE)\b/g, '<span class="type">$1</span>')
                        .replace(/\b(FUNCTION|RETURN|IF|ELSE|WHILE|FOR|DO|CLASS|PUBLIC|PRIVATE|STATIC|FINAL|NEW|SWAP|MAX|MIN|REPEAT|UNTIL|SWITCH|CASE|DEFAULT|BREAK|CONTINUE|FROM|TO|DOWNTO|AND|OR|NOT|IN|HAS|CONTAINS|SORT|BY)\b/g, '<span class="keyword">$1</span>');

                    html += `<span class="pseudo-line" data-line="${i}">
                        <span class="line-num">${i + 1}</span>${line}
                    </span>`;
                }
                return html;
            }

            // ============================================================

            // ============================================================

            // ============================================================
            // LISTENERS
            // ============================================================
            function attachControlListeners() {
                const btnTraverse = document.getElementById('btnTraverse');
                if (btnTraverse) btnTraverse.addEventListener('click', traverseDS);
                const btnReset = document.getElementById('btnReset');
                if (btnReset) btnReset.addEventListener('click', resetDS);
                const btnPush = document.getElementById('btnPush');
                if (btnPush) btnPush.addEventListener('click', pushStack);
                const btnPop = document.getElementById('btnPop');
                if (btnPop) btnPop.addEventListener('click', popStack);
                const btnPeek = document.getElementById('btnPeek');
                if (btnPeek) btnPeek.addEventListener('click', peekStack);
                const btnEnqueue = document.getElementById('btnEnqueue');
                if (btnEnqueue) btnEnqueue.addEventListener('click', enqueueQueue);
                const btnDequeue = document.getElementById('btnDequeue');
                if (btnDequeue) btnDequeue.addEventListener('click', dequeueQueue);
                const btnPeekFront = document.getElementById('btnPeekFront');
                if (btnPeekFront) btnPeekFront.addEventListener('click', peekQueue);
            }

            function attachScenarioListeners() {
                document.querySelectorAll('.scenario-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        stopCodeAnimation();
                        currentScenario = parseInt(e.currentTarget.dataset.scenario);
                        renderConcept();
                    });
                });
            }

            function attachSectionListeners() {
                document.querySelectorAll('.section-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const section = header.dataset.section;
                        sectionsOpen[section] = !sectionsOpen[section];
                        const body = document.getElementById('section-' + section);
                        const toggle = header.querySelector('.section-toggle');
                        if (sectionsOpen[section]) {
                            body.classList.add('open');
                            toggle.classList.add('open');
                        } else {
                            body.classList.remove('open');
                            toggle.classList.remove('open');
                        }
                    });
                });
            }

            function attachAnimationListeners() {
                document.querySelectorAll('.anim-btn.play').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const approachKey = e.currentTarget.dataset.animApproach;
                        const scenarioIdx = parseInt(e.currentTarget.dataset.scenario);
                        startCodeAnimation(approachKey, scenarioIdx);
                    });
                });

                document.querySelectorAll('.anim-btn.stop').forEach(btn => {
                    btn.addEventListener('click', () => {
                        stopCodeAnimation();
                    });
                });
            }

            // ============================================================
            // CODE ANIMATION
            // ============================================================
            function startCodeAnimation(approachKey, scenarioIdx) {
                stopCodeAnimation();

                const ds = DS[currentDS];
                const scenario = ds.scenarios[scenarioIdx];
                const data = scenario[approachKey];
                if (!data || !data.lines) return;

                const lines = data.lines;
                const total = lines.length;

                codeAnimState = {
                    running: true,
                    lineIndex: 0,
                    totalLines: total,
                    approachKey: approachKey,
                    scenarioIndex: scenarioIdx
                };

                const container = document.getElementById('pseudo-' + approachKey);
                if (!container) return;
                container.querySelectorAll('.pseudo-line').forEach(el => {
                    el.classList.remove('active', 'executed');
                });

                const playBtn = document.querySelector(`.anim-btn.play[data-anim-approach="${approachKey}"]`);
                const stopBtn = document.querySelector(`.anim-btn.stop[data-anim-stop="${approachKey}"]`);
                if (playBtn) playBtn.style.display = 'none';
                if (stopBtn) stopBtn.style.display = 'inline-flex';

                const statusEl = document.getElementById('status-' + approachKey);
                if (statusEl) {
                    statusEl.innerHTML = '<span class="dot running"></span> Running...';
                }

                codeAnimTimer = setInterval(() => {
                    stepCodeAnimation(approachKey);
                }, 900);
            }

            function stepCodeAnimation(approachKey) {
                if (!codeAnimState.running) return;

                const container = document.getElementById('pseudo-' + approachKey);
                if (!container) {
                    stopCodeAnimation();
                    return;
                }

                const lines = container.querySelectorAll('.pseudo-line');
                const current = codeAnimState.lineIndex;

                if (current >= codeAnimState.totalLines) {
                    stopCodeAnimation(true);
                    return;
                }

                lines.forEach((el, i) => {
                    el.classList.remove('active');
                    if (i < current) {
                        el.classList.add('executed');
                    }
                });

                if (lines[current]) {
                    lines[current].classList.add('active');
                    lines[current].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }

                codeAnimState.lineIndex++;
            }

            function stopCodeAnimation(complete = false) {
                codeAnimState.running = false;
                if (codeAnimTimer) {
                    clearInterval(codeAnimTimer);
                    codeAnimTimer = null;
                }

                const approachKey = codeAnimState.approachKey;
                if (approachKey) {
                    const playBtn = document.querySelector(`.anim-btn.play[data-anim-approach="${approachKey}"]`);
                    const stopBtn = document.querySelector(`.anim-btn.stop[data-anim-stop="${approachKey}"]`);
                    if (playBtn) playBtn.style.display = 'inline-flex';
                    if (stopBtn) stopBtn.style.display = 'none';

                    const statusEl = document.getElementById('status-' + approachKey);
                    if (statusEl) {
                        if (complete) {
                            statusEl.innerHTML = '<span class="dot" style="background:#10b981;"></span> Complete';
                        } else {
                            statusEl.innerHTML = '<span class="dot"></span> Ready';
                        }
                    }

                    if (!complete) {
                        const container = document.getElementById('pseudo-' + approachKey);
                        if (container) {
                            container.querySelectorAll('.pseudo-line').forEach(el => {
                                el.classList.remove('active');
                            });
                        }
                    }
                }

                codeAnimState.lineIndex = 0;
            }

            // ============================================================
            // VISUAL ANIMATION
            // ============================================================
            function resetHighlights() {
                highlightIndex = -1;
                highlightTop = false;
                highlightFront = false;
            }

            function stopAnimation() {
                if (animTimer) {
                    clearTimeout(animTimer);
                    animTimer = null;
                }
            }

            function resetDS() {
                stopAnimation();
                resetHighlights();
                animationData.array = [...DS.array.initialState];
                animationData.singly = [...DS.singly.initialState];
                animationData.doubly = [...DS.doubly.initialState];
                animationData.circular = [...DS.circular.initialState];
                animationData.stack = [...DS.stack.initialState];
                animationData.queue = [...DS.queue.initialState];
                renderConcept();
            }

            function traverseDS() {
                stopAnimation();
                resetHighlights();
                const data = animationData[currentDS];
                if (data.length === 0) return;
                let idx = 0;
                function step() {
                    highlightIndex = idx;
                    renderConcept();
                    idx++;
                    if (idx < data.length) {
                        animTimer = setTimeout(step, 650);
                    } else {
                        animTimer = setTimeout(() => {
                            highlightIndex = -1;
                            renderConcept();
                            animTimer = null;
                        }, 650);
                    }
                }
                step();
            }

            function pushStack() {
                stopAnimation();
                resetHighlights();
                const newVal = Math.floor(Math.random() * 90) + 10;
                animationData.stack.push(newVal);
                highlightTop = true;
                renderConcept();
                animTimer = setTimeout(() => {
                    highlightTop = false;
                    renderConcept();
                    animTimer = null;
                }, 600);
            }

            function popStack() {
                stopAnimation();
                resetHighlights();
                if (animationData.stack.length === 0) return;
                animationData.stack.pop();
                highlightTop = true;
                renderConcept();
                animTimer = setTimeout(() => {
                    highlightTop = false;
                    renderConcept();
                    animTimer = null;
                }, 600);
            }

            function peekStack() {
                stopAnimation();
                resetHighlights();
                if (animationData.stack.length === 0) return;
                highlightTop = true;
                renderConcept();
                animTimer = setTimeout(() => {
                    highlightTop = false;
                    renderConcept();
                    animTimer = null;
                }, 1200);
            }

            function enqueueQueue() {
                stopAnimation();
                resetHighlights();
                const newVal = Math.floor(Math.random() * 90) + 10;
                animationData.queue.push(newVal);
                renderConcept();
            }

            function dequeueQueue() {
                stopAnimation();
                resetHighlights();
                if (animationData.queue.length === 0) return;
                animationData.queue.shift();
                highlightFront = true;
                renderConcept();
                animTimer = setTimeout(() => {
                    highlightFront = false;
                    renderConcept();
                    animTimer = null;
                }, 600);
            }

            function peekQueue() {
                stopAnimation();
                resetHighlights();
                if (animationData.queue.length === 0) return;
                highlightFront = true;
                renderConcept();
                animTimer = setTimeout(() => {
                    highlightFront = false;
                    renderConcept();
                    animTimer = null;
                }, 1200);
            }

            // ============================================================
            // SWITCH
            // ============================================================
            function switchDS(dsKey) {
                stopAnimation();
                stopCodeAnimation();
                resetHighlights();
                currentDS = dsKey;
                currentScenario = 0;
                dsButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.ds === dsKey);
                });
                renderConcept();
            }

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                dsButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => switchDS(e.currentTarget.dataset.ds));
                });
                renderConcept();
            }

            init();
        })();
    </script>
</body>
</html>
