<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA · Foundations Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            line-height: 1.6;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app { max-width: 1440px; width: 100%; }

        /* ========== HEADER ========== */
        .header {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-left h1 i {
            background: linear-gradient(145deg, #2563eb, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.7rem;
        }

        .header-left .subhead {
            font-size: 0.95rem;
            color: #475569;
            margin-top: 0.2rem;
        }

        .progress-badge {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2563eb;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* ========== LAYOUT ========== */
        .dashboard {
            display: grid;
            grid-template-columns: 270px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            background: white;
            border-radius: 1.5rem;
            padding: 1.25rem 0.85rem;
            box-shadow: 0 4px 20px -8px rgba(15, 23, 42, 0.1);
            border: 1px solid #e9edf2;
            position: sticky;
            top: 1.5rem;
            max-height: calc(100vh - 3rem);
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: #64748b;
            padding: 0 0.6rem 0.7rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .ds-group { margin-bottom: 0.75rem; }

        .ds-group-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            color: #94a3b8;
            padding: 0.4rem 0.75rem 0.3rem;
        }

        .ds-list { display: flex; flex-direction: column; gap: 0.2rem; }

        .ds-btn {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            background: transparent;
            border: none;
            width: 100%;
            padding: 0.55rem 0.8rem;
            border-radius: 0.75rem;
            font-size: 0.84rem;
            font-weight: 500;
            color: #334155;
            transition: all 0.15s ease;
            cursor: pointer;
            text-align: left;
            font-family: 'Inter', sans-serif;
            border: 1px solid transparent;
            position: relative;
        }

        .ds-btn i { font-size: 0.9rem; width: 1.2rem; color: #64748b; }
        .ds-btn:hover { background: #f1f5f9; border-color: #e2e8f0; }
        .ds-btn.active {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
            font-weight: 600;
        }
        .ds-btn.active i { color: #2563eb; }
        .ds-btn.active::after {
            content: '';
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 16px;
            background: #2563eb;
            border-radius: 3px;
        }

        /* ========== MAIN ========== */
        .main { display: flex; flex-direction: column; gap: 1.5rem; }

        .concept-card {
            background: white;
            border-radius: 1.75rem;
            padding: 1.75rem;
            box-shadow: 0 4px 20px -8px rgba(15, 23, 42, 0.08);
            border: 1px solid #e9edf2;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .concept-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .concept-title i { color: #2563eb; font-size: 1.4rem; }

        .badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50px;
            padding: 0.25rem 0.85rem;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .concept-desc {
            font-size: 0.98rem;
            color: #1e293b;
            margin-bottom: 1.5rem;
            line-height: 1.7;
            background: #f8fafc;
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            border-left: 4px solid #3b82f6;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }
        .concept-desc i { color: #3b82f6; font-size: 1.1rem; margin-top: 0.15rem; flex-shrink: 0; }

        /* ========== VISUALIZATION ========== */
        .canvas-wrapper {
            background: #f8fafc;
            border-radius: 1.25rem;
            padding: 1.25rem 1rem;
            border: 1px solid #e9edf2;
            margin-bottom: 1.25rem;
            overflow-x: auto;
        }

        .canvas-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .canvas-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .canvas-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .canvas-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 160px;
            gap: 0.6rem;
            padding: 0.5rem;
        }

        /* Array block */
        .block {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6;
            border-radius: 0.9rem;
            min-width: 68px;
            height: 68px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1e40af;
            box-shadow: 0 4px 0 #bfdbfe, 0 6px 12px -4px rgba(15, 23, 42, 0.12);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            padding: 0.2rem;
            font-size: 0.95rem;
        }
        .block .index-label { font-size: 0.55rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-top: 0.1rem; }
        .block.highlight {
            border-color: #f59e0b; background: #fffbeb; transform: scale(1.08);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 4px 0 #d97706;
        }
        .block.algo-highlight {
            border-color: #8b5cf6; background: #f5f3ff; transform: scale(1.08);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25), 0 4px 0 #7c3aed;
        }

        /* Linked list nodes */
        .node { display: flex; align-items: center; gap: 0.15rem; }
        .node-block {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6;
            border-radius: 0.9rem;
            min-width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1e40af;
            box-shadow: 0 4px 0 #bfdbfe, 0 6px 10px -4px rgba(15, 23, 42, 0.1);
            padding: 0.2rem;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .node-block.highlight {
            border-color: #f59e0b; background: #fffbeb; transform: scale(1.08);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 4px 0 #d97706;
        }
        .node-arrow { font-size: 1.3rem; color: #94a3b8; margin: 0 -0.15rem; }
        .node-arrow.double { font-size: 1rem; color: #94a3b8; margin: 0 0.05rem; }
        .node-sub { font-size: 0.5rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.1rem; }
        .circular-badge {
            background: #eff6ff; border-radius: 40px; padding: 0.25rem 0.75rem;
            font-size: 0.65rem; font-weight: 700; color: #2563eb;
            border: 1px solid #bfdbfe; margin-left: 0.4rem;
        }
        .dll-container, .circular-container {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.15rem;
        }

        /* Stack */
        .vertical-stack {
            display: flex; flex-direction: column-reverse; align-items: center;
            justify-content: flex-start; gap: 0.35rem; min-height: 160px;
            padding: 0.5rem 1.5rem; border-left: 3px dashed #cbd5e1;
            border-right: 3px dashed #cbd5e1; margin: 0 auto; width: fit-content;
        }
        .stack-block {
            width: 100px; height: 48px;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6; border-radius: 0.75rem;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #1e40af; box-shadow: 0 3px 0 #bfdbfe;
            transition: all 0.25s; font-size: 0.95rem;
        }
        .stack-block.top-highlight {
            border-color: #f59e0b; background: #fffbeb; transform: translateX(5px);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 3px 0 #d97706;
        }

        /* Queue */
        .queue-horizontal {
            display: flex; flex-direction: row; align-items: center;
            justify-content: center; gap: 0.5rem; flex-wrap: wrap; padding: 1rem 0.5rem;
        }
        .queue-block {
            width: 60px; height: 60px;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6; border-radius: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #1e40af; box-shadow: 0 4px 0 #bfdbfe;
            transition: all 0.25s; font-size: 0.9rem;
        }
        .queue-block.front-highlight {
            border-color: #f59e0b; background: #fffbeb; transform: translateY(-4px);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 4px 0 #d97706;
        }

        /* Priority Queue / Heap */
        .heap-container { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 0.5rem; width: 100%; }
        .heap-level { display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; }
        .heap-node {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6; border-radius: 50%;
            width: 54px; height: 54px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 700; color: #1e40af;
            box-shadow: 0 4px 0 #bfdbfe, 0 6px 12px -4px rgba(15, 23, 42, 0.12);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            position: relative; font-size: 0.88rem;
        }
        .heap-node .idx-badge {
            position: absolute; bottom: -9px;
            background: #64748b; color: white; font-size: 0.5rem;
            font-weight: 600; padding: 0.1rem 0.35rem; border-radius: 50px;
        }
        .heap-node.highlight {
            border-color: #f59e0b; background: #fffbeb; transform: scale(1.12);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25), 0 4px 0 #d97706;
        }
        .heap-array {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35rem;
            padding: 0.5rem; background: #f1f5f9; border-radius: 0.75rem;
            border: 1px dashed #cbd5e1; margin-top: 0.5rem; width: 100%;
        }
        .heap-array-item {
            background: white; border: 1.5px solid #3b82f6; border-radius: 0.5rem;
            min-width: 40px; padding: 0.25rem 0.45rem; text-align: center;
            font-size: 0.72rem; font-weight: 600; color: #1e40af; transition: all 0.2s;
        }
        .heap-array-item.highlight {
            border-color: #f59e0b; background: #fffbeb;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25); transform: scale(1.08);
        }
        .heap-array-item .idx-badge { font-size: 0.45rem; color: #64748b; display: block; font-weight: 500; }

        /* ========== TREE VISUALIZATION ========== */
        .tree-canvas {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.5rem; padding: 1rem 0.5rem; width: 100%;
            min-height: 200px; justify-content: center;
        }
        .tree-level { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; }
        .tree-node {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 2px solid #3b82f6; border-radius: 50%;
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #1e40af;
            box-shadow: 0 4px 0 #bfdbfe, 0 6px 12px -4px rgba(15, 23, 42, 0.12);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            position: relative; font-size: 0.85rem;
            cursor: pointer;
        }
        .tree-node.highlight {
            border-color: #f59e0b; background: #fffbeb; transform: scale(1.12);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25), 0 4px 0 #d97706;
        }
        .tree-node.visited {
            border-color: #10b981; background: #ecfdf5;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2), 0 4px 0 #059669;
        }
        .tree-node.bfs-visited {
            border-color: #8b5cf6; background: #f5f3ff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2), 0 4px 0 #7c3aed;
        }
        .tree-connector {
            display: flex; justify-content: center; gap: 3rem;
            color: #cbd5e1; font-size: 0.8rem; letter-spacing: 0.2rem;
        }
        .tree-node .lbl { font-size: 0.45rem; color: #64748b; position: absolute; bottom: -14px; white-space: nowrap; }

        /* ========== GRAPH VISUALIZATION ========== */
        .graph-canvas {
            position: relative;
            width: 100%;
            min-height: 320px;
            background: #f8fafc;
            border-radius: 1rem;
            border: 1px solid #e9edf2;
            overflow: hidden;
        }
        .graph-svg { width: 100%; height: 320px; display: block; }
        .graph-edge { stroke: #cbd5e1; stroke-width: 2.5; transition: stroke 0.3s, stroke-width 0.3s; }
        .graph-edge.visited { stroke: #8b5cf6; stroke-width: 3.5; }
        .graph-edge.mst { stroke: #10b981; stroke-width: 4; }
        .graph-node-circle {
            fill: white; stroke: #3b82f6; stroke-width: 2.5;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            cursor: pointer;
        }
        .graph-node-circle.highlight { fill: #fffbeb; stroke: #f59e0b; stroke-width: 3.5; }
        .graph-node-circle.visited { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 3.5; }
        .graph-node-circle.start { fill: #ecfdf5; stroke: #10b981; stroke-width: 3.5; }
        .graph-node-text {
            font-family: 'Inter', sans-serif;
            font-size: 11px; font-weight: 700; fill: #1e40af;
            text-anchor: middle; dominant-baseline: central;
            pointer-events: none;
        }
        .graph-weight-text {
            font-family: 'Inter', sans-serif;
            font-size: 9px; font-weight: 700; fill: #64748b;
            text-anchor: middle; dominant-baseline: central;
            pointer-events: none;
        }

        /* ========== CONTROLS ========== */
        .controls {
            display: flex; flex-wrap: wrap; gap: 0.6rem;
            margin-top: 1.25rem; align-items: center;
        }
        .btn {
            background: white; border: 1.5px solid #e2e8f0;
            padding: 0.6rem 1.2rem; border-radius: 2rem;
            font-weight: 600; font-size: 0.85rem; color: #334155;
            display: inline-flex; align-items: center; gap: 0.5rem;
            cursor: pointer; transition: all 0.15s;
            font-family: 'Inter', sans-serif;
        }
        .btn i { font-size: 0.85rem; }
        .btn:hover { background: #f1f5f9; border-color: #cbd5e1; color: #0f172a; }
        .btn.primary {
            background: #2563eb; border-color: #2563eb; color: white;
            box-shadow: 0 4px 12px -4px rgba(37, 99, 235, 0.4);
        }
        .btn.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        /* ========== SECTIONS ========== */
        .section {
            margin-top: 1.5rem; border-top: 1px solid #e9edf2; padding-top: 1.25rem;
        }
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; padding: 0.5rem 0; user-select: none;
            border-radius: 0.5rem; transition: background 0.15s;
        }
        .section-header:hover { background: #f8fafc; }
        .section-header h3 {
            font-size: 1.05rem; font-weight: 700; color: #0f172a;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .section-header h3 i { color: #2563eb; font-size: 0.95rem; }
        .section-toggle { color: #94a3b8; font-size: 0.85rem; transition: transform 0.2s; }
        .section-toggle.open { transform: rotate(180deg); }
        .section-body { padding: 0.75rem 0 0.25rem; display: none; }
        .section-body.open { display: block; }

        /* ========== INSIGHT GRID ========== */
        .insight-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
        }
        .insight-item {
            background: #f8fafc; padding: 0.85rem 1rem;
            border-radius: 1rem; border: 1px solid #e9edf2;
        }
        .insight-item .label {
            font-size: 0.65rem; text-transform: uppercase;
            letter-spacing: 0.06em; font-weight: 700; color: #64748b;
            margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.35rem;
        }
        .insight-item .label i { font-size: 0.7rem; color: #3b82f6; }
        .insight-item .value {
            font-size: 0.9rem; font-weight: 500; color: #0f172a; line-height: 1.5;
        }

        /* ========== NOTES ========== */
        .notes-content {
            background: #f8fafc; border-radius: 1rem; padding: 1.25rem;
            border: 1px solid #e9edf2; font-size: 0.9rem;
            line-height: 1.7; color: #1e293b;
        }
        .notes-content h4 {
            font-size: 1rem; font-weight: 700; color: #2563eb;
            margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.4rem;
        }
        .notes-content p { margin-bottom: 0.7rem; }
        .notes-content ul { margin: 0.4rem 0 0.8rem 1.25rem; }
        .notes-content li { margin-bottom: 0.4rem; }
        .notes-content li strong { color: #2563eb; font-weight: 600; }
        .notes-content code {
            background: #e2e8f0; padding: 0.1rem 0.4rem;
            border-radius: 0.3rem; font-size: 0.85rem;
            font-weight: 600; color: #0f172a;
        }
        .note-highlight {
            background: #fffbeb; border-left: 4px solid #f59e0b;
            padding: 0.7rem 1rem; border-radius: 0.6rem;
            margin: 0.8rem 0; font-size: 0.88rem;
        }
        .note-highlight strong { color: #d97706; }

        /* ========== MEMORY MAP ========== */
        .memory-map {
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            border-radius: 1rem; padding: 1.5rem;
            border: 1px solid #bae6fd; margin-top: 0.5rem;
        }
        .memory-map h4 {
            font-size: 1.05rem; font-weight: 700; color: #0369a1;
            margin-bottom: 0.85rem; display: flex; align-items: center; gap: 0.5rem;
        }
        .memory-map .map-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.85rem;
        }
        .memory-map .map-card {
            background: white; border-radius: 0.85rem; padding: 0.9rem 1rem;
            border: 1px solid #bae6fd; box-shadow: 0 2px 8px -4px rgba(3, 105, 161, 0.15);
        }
        .memory-map .map-card .map-label {
            font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
            font-weight: 700; color: #0369a1; margin-bottom: 0.35rem;
            display: flex; align-items: center; gap: 0.35rem;
        }
        .memory-map .map-card .map-value {
            font-size: 0.88rem; color: #0f172a; line-height: 1.6;
        }
        .memory-map .map-value code {
            background: #e0f2fe; padding: 0.1rem 0.4rem;
            border-radius: 0.3rem; font-size: 0.82rem;
            font-weight: 600; color: #0369a1;
        }
        .memory-map .derivation-box {
            background: white; border-radius: 0.85rem; padding: 1rem 1.2rem;
            border: 1px solid #bae6fd; margin-top: 0.85rem;
        }
        .memory-map .derivation-box .step {

                            "        IF parent != null: mst.append((parent, u, w))",
                            "        FOR (v, ew) IN adj[u]:",

        // ============================================================

        function highlightPseudocode(code, approachKey, scenarioIndex) {
            const lines = code.split('\n');

            let html = '';

                    .replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/(\/\/.*)/g, '<span class="comment">$1</span>')
                    .replace(/\b(INT|FLOAT|BOOLEAN|CHAR|VOID|STRING|LIST|MAP|SET|QUEUE|STACK|NODE|TREENODE|LISTNODE|HEAP|DEQUE|PAIR|VERTEX|EDGE|GRAPH)\b/g, '<span class="type">$1</span>')
                    .replace(/\b(FUNCTION|RETURN|IF|ELSE|WHILE|FOR|DO|CLASS|PUBLIC|PRIVATE|STATIC|FINAL|NEW|SWAP|MAX|MIN|REPEAT|UNTIL|SWITCH|CASE|DEFAULT|BREAK|CONTINUE|FROM|TO|DOWNTO|AND|OR|NOT|IN|HAS|CONTAINS|SORT|BY|EMPTY|PUSH|POP|PEEK|INSERT|DELETE|EXTRACT|MERGE|PARTITION|QUICKSELECT|DIJKSTRA|BFS|DFS|VISIT|CALL|RECORD|APPLY|FIND|UNION|KRUSKAL|PRIM)\b/g, '<span class="keyword">$1</span>');

                html += `<span class="pseudo-line" data-line="${i}">

            }
            return html;

        // ============================================================
        // TREE VISUALIZATION
        // ============================================================
        function renderTreeVisualization(node) {
            if (!node) return '<div class="empty-state"><i class="fas fa-inbox"></i><p>Tree is empty</p></div>';

            // Compute levels via BFS
            const levels = [];
            let queue = [node];
            while (queue.length > 0) {
                const levelSize = queue.length;
                const level = [];
                for (let i = 0; i < levelSize; i++) {
                    const n = queue.shift();
                    level.push(n);
                    if (n.left) queue.push(n.left);
                    if (n.right) queue.push(n.right);
                }
                levels.push(level);
            }

            let html = '<div class="tree-canvas">';
            levels.forEach((level, li) => {
                html += '<div class="tree-level">';
                level.forEach(n => {
                    const val = n.val;
                    const isVisited = graphVisited.has(`tree-${val}`);
                    const hlClass = (highlightIndex === val || graphHighlight === val) ? 'highlight' : (isVisited ? 'visited' : '');
                    html += `<div class="tree-node ${hlClass}" data-val="${val}">
                        ${val}
                        <span class="lbl">${n.left ? 'L' : ''}${n.right ? 'R' : ''}</span>
                    </div>`;
                });
                html += '</div>';
                if (li < levels.length - 1) {
                    html += '<div class="tree-connector">' + '│ '.repeat(Math.max(1, Math.floor(levels[li+1].length / 2))) + '</div>';
                }
            });
            html += '</div>';
            return html;
        }

        // ============================================================
        // GRAPH VISUALIZATION (SVG)
        // ============================================================
        function renderGraphVisualization(data) {
            if (!data) return '';
            const { nodes, edges } = data;

            let svg = '<svg class="graph-svg" viewBox="0 0 700 320" preserveAspectRatio="xMidYMid meet">';

            // Draw edges
            edges.forEach(e => {
                const from = nodes.find(n => n.id === e.from);
                const to = nodes.find(n => n.id === e.to);
                if (!from || !to) return;
                const key1 = `${e.from}-${e.to}`;
                const key2 = `${e.to}-${e.from}`;
                const isMST = graphMSTEdges.has(key1) || graphMSTEdges.has(key2);
                const isVisited = graphVisitedEdges.has(key1) || graphVisitedEdges.has(key2);
                let cls = 'graph-edge';
                if (isMST) cls += ' mst';
                else if (isVisited) cls += ' visited';
                svg += `<line class="${cls}" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" />`;

                // Weight label
                const mx = (from.x + to.x) / 2;
                const my = (from.y + to.y) / 2;
                svg += `<text class="graph-weight-text" x="${mx}" y="${my - 8}">${e.weight}</text>`;
            });

            // Draw nodes
            nodes.forEach(n => {
                let cls = 'graph-node-circle';
                if (graphHighlight === n.id) cls += ' highlight';
                else if (graphVisited.has(n.id)) cls += ' visited';
                if (n.id === 0 && graphVisited.has(0)) cls += ' start';
                svg += `<circle class="${cls}" cx="${n.x}" cy="${n.y}" r="22" />`;
                svg += `<text class="graph-node-text" x="${n.x}" y="${n.y}">${n.label}</text>`;
            });

            svg += '</svg>';
            return svg;
        }

        // ============================================================
        // HEAP VISUALIZATION
        // ============================================================
        function renderHeapVisualization(data) {
            if (!data || data.length === 0) {
                return '<div class="empty-state"><i class="fas fa-inbox"></i><p>Heap is empty.</p></div>';
            }
            const n = data.length;
            let levels = [];
            let idx = 0;
            let levelSize = 1;
            while (idx < n) {
                let level = [];
                for (let i = 0; i < levelSize && idx < n; i++) {
                    level.push({ val: data[idx], index: idx });
                    idx++;
                }
                levels.push(level);
                levelSize *= 2;
            }

            let html = '<div class="heap-container">';
            levels.forEach((level, li) => {
                html += '<div class="heap-level">';
                level.forEach(node => {
                    const hl = (highlightIndex === node.index) ? 'highlight' : '';
                    html += `<div class="heap-node ${hl}">
                        ${node.val}
                        <span class="idx-badge">[${node.index}]</span>
                    </div>`;
                });
                html += '</div>';
                if (li < levels.length - 1) {
                    html += '<div class="tree-connector">' + '│ '.repeat(Math.max(1, Math.floor(levels[li+1].length / 2))) + '</div>';
                }
            });
            html += '</div>';

            html += '<div class="heap-array">';
            data.forEach((val, i) => {
                const hl = (highlightIndex === i) ? 'highlight' : '';
                html += `<div class="heap-array-item ${hl}">${val}<span class="idx-badge">[${i}]</span></div>`;
            });
            html += '</div>';

            return html;
        }

                { key: 'best', label: 'Optimal', icon: 'fa-trophy', cls: 'best' }
            ];

            const approachesHTML = approaches.map(a => {
                const d = activeScenario[a.key];
                if (!d) return '';
                const pseudoHTML = highlightPseudocode(d.code, a.key, currentScenario);
                const deriv = d.derivation ? `<div style="background:#f0f9ff; border-left:3px solid #38bdf8; padding:0.5rem 0.7rem; border-radius:0.5rem; margin-top:0.5rem; font-size:0.75rem; color:#0369a1; line-height:1.5;"><i class="fas fa-lightbulb" style="margin-right:0.3rem;"></i>${d.derivation}</div>` : '';
                return `<div class="approach-card" data-approach="${a.key}">
                    <div class="approach-label ${a.cls}"><i class="fas ${a.icon}"></i> ${d.label}</div>
                    <div class="approach-time"><i class="fas fa-clock" style="margin-right:0.25rem;"></i>${d.time}</div>
                    <div class="pseudo-wrapper">
                        <pre id="pseudo-${a.key}">${pseudoHTML}</pre>
                        <div class="anim-controls">
                            <button class="anim-btn play" data-anim-approach="${a.key}" data-scenario="${currentScenario}"><i class="fas fa-play"></i> Animate</button>
                            <button class="anim-btn stop" data-anim-stop="${a.key}" style="display:none;"><i class="fas fa-stop"></i> Stop</button>
                            <span class="anim-status" id="status-${a.key}"><span class="dot"></span> Ready</span>
                        </div>
                    </div>
                    ${deriv}
                </div>`;
            }).join('');

            const scenariosHTML = `
                <div class="scenario-tabs">${tabsHTML}</div>
                <div class="scenario-panel">
                    <h4><i class="fas ${activeScenario.icon}"></i> ${activeScenario.title}</h4>
                    <div class="problem-statement">${activeScenario.problem}</div>
                    <div class="approach-grid">${approachesHTML}</div>
                </div>`;

            // ---------- ASSEMBLE ----------
            conceptCard.innerHTML = `
                <div class="title-row">
                    <div class="concept-title"><i class="fas ${ds.icon}"></i> ${ds.title}<span class="badge">${ds.category.toUpperCase()}</span></div>
                </div>
                <div class="concept-desc"><i class="fas fa-info-circle"></i><div>${ds.desc}</div></div>
                <div class="canvas-wrapper">
                    <div class="canvas-header">
                        <div class="canvas-label"><i class="fas fa-eye"></i> Live Visualization</div>
                        <div class="canvas-hint"><i class="fas fa-hand-pointer"></i> Use the buttons below to interact</div>
                    </div>
                    ${canvasHTML}
                </div>
                <div class="controls">${controlsHTML}</div>
                <div class="section">
                    <div class="section-header" data-section="memorymap">
                        <h3><i class="fas fa-brain"></i> Memory Map — Derive Any Solution</h3>
                        <i class="fas fa-chevron-down section-toggle ${sectionsOpen.memorymap ? 'open' : ''}"></i>
                    </div>
                    <div class="section-body ${sectionsOpen.memorymap ? 'open' : ''}" id="section-memorymap">${memoryMapHTML}</div>
                </div>
                <div class="section">
                    <div class="section-header" data-section="scenarios">
                        <h3><i class="fas fa-tasks"></i> Scenarios & Animated Pseudocode</h3>
                        <i class="fas fa-chevron-down section-toggle ${sectionsOpen.scenarios ? 'open' : ''}"></i>
                    </div>
                    <div class="section-body ${sectionsOpen.scenarios ? 'open' : ''}" id="section-scenarios">${scenariosHTML}</div>
                </div>
                <div class="section">
                    <div class="section-header" data-section="insights">
                        <h3><i class="fas fa-microscope"></i> Complexity Insights</h3>
                        <i class="fas fa-chevron-down section-toggle ${sectionsOpen.insights ? 'open' : ''}"></i>
                    </div>
                    <div class="section-body ${sectionsOpen.insights ? 'open' : ''}" id="section-insights">${insightHTML}</div>
                </div>
                <div class="section">
                    <div class="section-header" data-section="notes">
                        <h3><i class="fas fa-book-open"></i> In-Depth Notes</h3>
                        <i class="fas fa-chevron-down section-toggle ${sectionsOpen.notes ? 'open' : ''}"></i>
                    </div>
                    <div class="section-body ${sectionsOpen.notes ? 'open' : ''}" id="section-notes">${notesHTML}</div>
                </div>`;

            attachControlListeners();
            attachScenarioListeners();
            attachSectionListeners();
            attachAnimationListeners();
        }

        // ============================================================
        // LISTENERS
        // ============================================================
        function attachControlListeners() {
            const byId = id => document.getElementById(id);
            const handlers = {
                btnTraverse: traverseDS, btnReset: resetDS,
                btnPush: pushStack, btnPop: popStack, btnPeek: peekStack,
                btnEnqueue: enqueueQueue, btnDequeue: dequeueQueue, btnPeekFront: peekQueue,
                btnPQPush: pushPQ, btnPQPop: popPQ, btnPQPeek: peekPQ,
                btnTreePreorder: () => treeTraverse('preorder'),
                btnTreeInorder: () => treeTraverse('inorder'),
                btnTreePostorder: () => treeTraverse('postorder'),
                btnTreeBFS: () => treeTraverse('bfs'),
                btnBFS: () => graphBFS(),
                btnDFS: () => graphDFS(),
                btnKruskal: () => runKruskal(),
                btnPrim: () => runPrim()
            };
            Object.entries(handlers).forEach(([id, fn]) => {
                const el = byId(id);
                if (el) el.addEventListener('click', fn);
            });
        }

        function attachScenarioListeners() {
            document.querySelectorAll('.scenario-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    stopCodeAnimation();
                    currentScenario = parseInt(e.currentTarget.dataset.scenario);
                    renderConcept();
                });
            });
        }

        function attachSectionListeners() {
            document.querySelectorAll('.section-header').forEach(header => {
                header.addEventListener('click', () => {
                    const section = header.dataset.section;
                    sectionsOpen[section] = !sectionsOpen[section];
                    const body = document.getElementById('section-' + section);
                    const toggle = header.querySelector('.section-toggle');
                    if (sectionsOpen[section]) { body.classList.add('open'); toggle.classList.add('open'); }
                    else { body.classList.remove('open'); toggle.classList.remove('open'); }
                });
            });
        }

        function attachAnimationListeners() {
            document.querySelectorAll('.anim-btn.play').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    startCodeAnimation(e.currentTarget.dataset.animApproach, parseInt(e.currentTarget.dataset.scenario));
                });
            });
            document.querySelectorAll('.anim-btn.stop').forEach(btn => {
                btn.addEventListener('click', () => stopCodeAnimation());
            });
        }

        // ============================================================
        // CODE ANIMATION
        // ============================================================
        function startCodeAnimation(approachKey, scenarioIdx) {
            stopCodeAnimation();
            const scenario = DS[currentDS].scenarios[scenarioIdx];
            const data = scenario[approachKey];
            if (!data || !data.lines) return;

            codeAnimState = { running: true, lineIndex: 0, totalLines: data.lines.length, approachKey, scenarioIndex: scenarioIdx };

            const container = document.getElementById('pseudo-' + approachKey);
            if (!container) return;
            container.querySelectorAll('.pseudo-line').forEach(el => el.classList.remove('active', 'executed'));

            const playBtn = document.querySelector(`.anim-btn.play[data-anim-approach="${approachKey}"]`);
            const stopBtn = document.querySelector(`.anim-btn.stop[data-anim-stop="${approachKey}"]`);
            if (playBtn) playBtn.style.display = 'none';
            if (stopBtn) stopBtn.style.display = 'inline-flex';
            const statusEl = document.getElementById('status-' + approachKey);
            if (statusEl) statusEl.innerHTML = '<span class="dot running"></span> Running...';

            codeAnimTimer = setInterval(() => stepCodeAnimation(approachKey), 900);
        }

        function stepCodeAnimation(approachKey) {
            if (!codeAnimState.running) return;
            const container = document.getElementById('pseudo-' + approachKey);
            if (!container) { stopCodeAnimation(); return; }
            const lines = container.querySelectorAll('.pseudo-line');
            const current = codeAnimState.lineIndex;
            if (current >= codeAnimState.totalLines) { stopCodeAnimation(true); return; }

            lines.forEach((el, i) => {
                el.classList.remove('active');
                if (i < current) el.classList.add('executed');
            });
            if (lines[current]) {
                lines[current].classList.add('active');
                lines[current].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
            codeAnimState.lineIndex++;
        }

        function stopCodeAnimation(complete = false) {
            codeAnimState.running = false;
            if (codeAnimTimer) { clearInterval(codeAnimTimer); codeAnimTimer = null; }
            const approachKey = codeAnimState.approachKey;
            if (approachKey) {
                const playBtn = document.querySelector(`.anim-btn.play[data-anim-approach="${approachKey}"]`);
                const stopBtn = document.querySelector(`.anim-btn.stop[data-anim-stop="${approachKey}"]`);
                if (playBtn) playBtn.style.display = 'inline-flex';
                if (stopBtn) stopBtn.style.display = 'none';
                const statusEl = document.getElementById('status-' + approachKey);
                if (statusEl) statusEl.innerHTML = complete
                    ? '<span class="dot" style="background:#10b981;"></span> Complete'
                    : '<span class="dot"></span> Ready';
                if (!complete) {
                    const container = document.getElementById('pseudo-' + approachKey);
                    if (container) container.querySelectorAll('.pseudo-line').forEach(el => el.classList.remove('active'));
                }
            }
            codeAnimState.lineIndex = 0;
        }

        // ============================================================
        // VISUAL ANIMATION
        // ============================================================
        function resetHighlights() { highlightIndex = -1; highlightTop = false; highlightFront = false; }
        function stopAnimation() { if (animTimer) { clearTimeout(animTimer); animTimer = null; } }

        function resetDS() {
            stopAnimation();
            resetHighlights();
            stopGraphAnimation();
            // Reset linear
            animationData = {
                array: [12, 24, 36, 48, 60],
                singly: [7, 14, 21, 28],
                doubly: [10, 20, 30, 40],
                circular: [5, 15, 25, 35],
                stack: [10, 20, 30],
                queue: [5, 10, 15, 20],
                priorityqueue: [3, 7, 9, 15, 22, 11, 30]
            };
            graphVisited = new Set();
            graphHighlight = -1;
            graphMSTEdges = new Set();
            graphVisitedEdges = new Set();
            renderConcept();
        }

        function traverseDS() {
            stopAnimation();
            resetHighlights();
            const data = animationData[currentDS];
            if (data.length === 0) return;
            let idx = 0;
            function step() {
                highlightIndex = idx;
                renderConcept();
                idx++;
                if (idx < data.length) {
                    animTimer = setTimeout(step, 650);
                } else {
                    animTimer = setTimeout(() => {
                        highlightIndex = -1;
                        renderConcept();
                        animTimer = null;
                    }, 650);
                }
            }
            step();
        }

        function pushStack() {
            stopAnimation(); resetHighlights();
            animationData.stack.push(Math.floor(Math.random() * 90) + 10);
            highlightTop = true;
            renderConcept();
            animTimer = setTimeout(() => { highlightTop = false; renderConcept(); animTimer = null; }, 600);
        }
        function popStack() {
            stopAnimation(); resetHighlights();
            if (animationData.stack.length === 0) return;
            animationData.stack.pop();
            highlightTop = true;
            renderConcept();
            animTimer = setTimeout(() => { highlightTop = false; renderConcept(); animTimer = null; }, 600);
        }
        function peekStack() {
            stopAnimation(); resetHighlights();
            if (animationData.stack.length === 0) return;
            highlightTop = true;
            renderConcept();
            animTimer = setTimeout(() => { highlightTop = false; renderConcept(); animTimer = null; }, 1200);
        }

        function enqueueQueue() {
            stopAnimation(); resetHighlights();
            animationData.queue.push(Math.floor(Math.random() * 90) + 10);
            renderConcept();
        }
        function dequeueQueue() {
            stopAnimation(); resetHighlights();
            if (animationData.queue.length === 0) return;
            animationData.queue.shift();
            highlightFront = true;
            renderConcept();
            animTimer = setTimeout(() => { highlightFront = false; renderConcept(); animTimer = null; }, 600);
        }
        function peekQueue() {
            stopAnimation(); resetHighlights();
            if (animationData.queue.length === 0) return;
            highlightFront = true;
            renderConcept();
            animTimer = setTimeout(() => { highlightFront = false; renderConcept(); animTimer = null; }, 1200);
        }

        // Heap operations
        function heapifyUp(arr, i) {
            while (i > 0) {
                const p = Math.floor((i - 1) / 2);
                if (arr[p] > arr[i]) { [arr[p], arr[i]] = [arr[i], arr[p]]; i = p; }
                else break;
            }
        }
        function heapifyDown(arr, i, n) {
            while (true) {
                let s = i, l = 2*i+1, r = 2*i+2;
                if (l < n && arr[l] < arr[s]) s = l;
                if (r < n && arr[r] < arr[s]) s = r;
                if (s === i) break;
                [arr[i], arr[s]] = [arr[s], arr[i]];
                i = s;
            }
        }
        function pushPQ() {
            stopAnimation(); resetHighlights();
            const v = Math.floor(Math.random() * 90) + 10;
            animationData.priorityqueue.push(v);
            heapifyUp(animationData.priorityqueue, animationData.priorityqueue.length - 1);
            highlightIndex = animationData.priorityqueue.indexOf(v);
            renderConcept();
            animTimer = setTimeout(() => { highlightIndex = -1; renderConcept(); animTimer = null; }, 900);
        }
        function popPQ() {
            stopAnimation(); resetHighlights();
            const arr = animationData.priorityqueue;
            if (arr.length === 0) return;
            const last = arr.pop();
            if (arr.length > 0) { arr[0] = last; heapifyDown(arr, 0, arr.length); }
            highlightIndex = 0;
            renderConcept();
            animTimer = setTimeout(() => { highlightIndex = -1; renderConcept(); animTimer = null; }, 900);
        }
        function peekPQ() {
            stopAnimation(); resetHighlights();
            if (animationData.priorityqueue.length === 0) return;
            highlightIndex = 0;
            renderConcept();
            animTimer = setTimeout(() => { highlightIndex = -1; renderConcept(); animTimer = null; }, 1500);
        }

        // Tree traversal animation
        function treeTraverse(order) {
            stopAnimation();
            graphVisited = new Set();
            graphHighlight = -1;
            const root = DS[currentDS].treeData;
            const sequence = [];

            function preorder(n) { if (!n) return; sequence.push(n.val); preorder(n.left); preorder(n.right); }
            function inorder(n) { if (!n) return; inorder(n.left); sequence.push(n.val); inorder(n.right); }
            function postorder(n) { if (!n) return; postorder(n.left); postorder(n.right); sequence.push(n.val); }
            function bfs(n) {
                if (!n) return;
                const q = [n];
                while (q.length) { const x = q.shift(); sequence.push(x.val); if (x.left) q.push(x.left); if (x.right) q.push(x.right); }
            }

            if (order === 'preorder') preorder(root);
            else if (order === 'inorder') inorder(root);
            else if (order === 'postorder') postorder(root);
            else bfs(root);

            let i = 0;
            function step() {
                if (i >= sequence.length) {
                    graphHighlight = -1;
                    renderConcept();
                    return;
                }
                graphHighlight = sequence[i];
                graphVisited.add(`tree-${sequence[i]}`);
                renderConcept();
                i++;
                animTimer = setTimeout(step, 700);
            }
            step();
        }

        // Graph BFS
        function graphBFS() {
            stopGraphAnimation();
            graphVisited = new Set();
            graphVisitedEdges = new Set();
            graphHighlight = -1;

            const { nodes, edges } = DS.graph.graphData;
            const adj = {};
            nodes.forEach(n => adj[n.id] = []);
            edges.forEach(e => { adj[e.from].push(e.to); adj[e.to].push(e.from); });

            const queue = [0];
            graphVisited.add(0);
            let i = 0;

            function step() {
                if (queue.length === 0) {
                    graphHighlight = -1;
                    renderConcept();
                    return;
                }
                const u = queue.shift();
                graphHighlight = u;
                // Mark edges from u to visited neighbors
                adj[u].forEach(v => {
                    if (graphVisited.has(v)) {
                        graphVisitedEdges.add(`${u}-${v}`);
                        graphVisitedEdges.add(`${v}-${u}`);
                    }
                });
                adj[u].forEach(v => {
                    if (!graphVisited.has(v)) {
                        graphVisited.add(v);
                        queue.push(v);
                        graphVisitedEdges.add(`${u}-${v}`);
                        graphVisitedEdges.add(`${v}-${u}`);
                    }
                });
                renderConcept();
                animTimer = setTimeout(step, 700);
            }
            step();
        }

        // Graph DFS
        function graphDFS() {
            stopGraphAnimation();
            graphVisited = new Set();
            graphVisitedEdges = new Set();
            graphHighlight = -1;

            const { nodes, edges } = DS.graph.graphData;
            const adj = {};
            nodes.forEach(n => adj[n.id] = []);
            edges.forEach(e => { adj[e.from].push(e.to); adj[e.to].push(e.from); });

            const order = [];
            function dfs(u) {
                graphVisited.add(u);
                order.push(u);
                adj[u].forEach(v => {
                    if (!graphVisited.has(v)) {
                        graphVisitedEdges.add(`${u}-${v}`);
                        graphVisitedEdges.add(`${v}-${u}`);
                        dfs(v);
                    }
                });
            }
            dfs(0);

            let i = 0;
            graphVisited = new Set();
            const savedVisited = new Set(graphVisited);
            function step() {
                if (i >= order.length) {
                    graphHighlight = -1;
                    renderConcept();
                    return;
                }
                graphVisited.add(order[i]);
                graphHighlight = order[i];
                renderConcept();
                i++;
                animTimer = setTimeout(step, 700);
            }
            step();
        }

        function stopGraphAnimation() { if (animTimer) { clearTimeout(animTimer); animTimer = null; } }

        // Kruskal MST
        function runKruskal() {
            stopAnimation();
            graphMSTEdges = new Set();
            graphVisitedEdges = new Set();
            graphVisited = new Set();
            graphHighlight = -1;

            const { nodes, edges } = DS.graph.graphData;
            const sorted = [...edges].sort((a, b) => a.weight - b.weight);
            const parent = {};
            nodes.forEach(n => parent[n.id] = n.id);
            function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
            function union(a, b) { const ra = find(a), rb = find(b); if (ra === rb) return false; parent[ra] = rb; return true; }

            const mst = [];
            for (const e of sorted) {
                if (union(e.from, e.to)) {
                    mst.push(e);
                    if (mst.length === nodes.length - 1) break;
                }
            }

            let i = 0;
            function step() {
                if (i >= mst.length) { graphHighlight = -1; renderConcept(); return; }
                const e = mst[i];
                graphMSTEdges.add(`${e.from}-${e.to}`);
                graphMSTEdges.add(`${e.to}-${e.from}`);
                graphVisited.add(e.from);
                graphVisited.add(e.to);
                graphHighlight = e.to;
                renderConcept();
                i++;
                animTimer = setTimeout(step, 700);
            }
            step();
        }

        // Prim MST
        function runPrim() {
            stopAnimation();
            graphMSTEdges = new Set();
            graphVisitedEdges = new Set();
            graphVisited = new Set();
            graphHighlight = -1;

            const { nodes, edges } = DS.graph.graphData;
            const adj = {};
            nodes.forEach(n => adj[n.id] = []);
            edges.forEach(e => { adj[e.from].push({ to: e.to, w: e.weight }); adj[e.to].push({ to: e.from, w: e.weight }); });

            const inMST = new Set();
            const mst = [];
            // Simple priority queue via sorted array
            const pq = [{ to: 0, from: null, w: 0 }];

            while (pq.length > 0 && mst.length < nodes.length - 1) {
                pq.sort((a, b) => a.w - b.w);
                const { to, from, w } = pq.shift();
                if (inMST.has(to)) continue;
                inMST.add(to);
                if (from !== null) mst.push({ from, to, w });
                adj[to].forEach(({ to: v, w: ew }) => {
                    if (!inMST.has(v)) pq.push({ to: v, from: to, w: ew });
                });
            }

            let i = 0;
            function step() {
                if (i >= mst.length) { graphHighlight = -1; renderConcept(); return; }
                const e = mst[i];
                graphMSTEdges.add(`${e.from}-${e.to}`);
                graphMSTEdges.add(`${e.to}-${e.from}`);
                graphVisited.add(e.from);
                graphVisited.add(e.to);
                graphHighlight = e.to;
                renderConcept();
                i++;
                animTimer = setTimeout(step, 700);
            }
            step();
        }

        // ============================================================
        // SWITCH
        // ============================================================
        function switchDS(dsKey) {
            stopAnimation();
            stopCodeAnimation();
            stopGraphAnimation();
            resetHighlights();
            currentDS = dsKey;
            currentScenario = 0;
            graphVisited = new Set();
            graphHighlight = -1;
            graphMSTEdges = new Set();
            graphVisitedEdges = new Set();
            renderSidebar();
            renderConcept();
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            renderSidebar();
            renderConcept();
        }

        init();
    </script>
</body>
